    <section id="formulario">
      <p>Ó bien déjanos un mensaje</p>
      <form action="">
        <label for="nombre" class="nombre">Nombre y apellido</label>
        <input
          id="nombre"
          type="text"
          class="nombre"
          placeholder="Nombre completo"
        />
        <br />
        <label for="numero" class="numero">Número de teléfono</label>
        <input
          id="numero"
          type="number"
          class="telefono"
          placeholder="Teléfono"
        />
        <br />
        <label for="mensaje" class="mensaje">Introduce tu mensaje</label>
        <br />
        <textarea
          name="mensaje"
          id="mensaje"
          placeholder="introduce tu mensaje aqui"
        ></textarea>
        <button type="submit">Enviar</button>
      </form>
    </section>
